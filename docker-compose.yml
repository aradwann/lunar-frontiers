services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lunar_frontiers
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lunar_frontiers
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["sh", "/run-migrations.sh"]

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lunar_frontiers
      RUST_LOG: info
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
